name: equiflow-source-mysql

x-app: &app
  image: equiflow-source-app:2.0.0
  pull_policy: never
  init: true

x-java-environment: &java-environment
  SERVER_ADDRESS: 0.0.0.0
  JAVA_TOOL_OPTIONS: -Xmx384m

x-discovery-environment: &discovery-environment
  <<: *java-environment
  SPRING_APPLICATION_JSON: >-
    {"eureka":{"client":{"service-url":{"defaultZone":"http://registry:28761/eureka/"},"initial-instance-info-replication-interval-seconds":1}}}
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans

x-business-environment: &business-environment
  <<: *discovery-environment
  SPRING_CONFIG_IMPORT: configserver:http://config:28888
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DATABASE_USER: ${EQUIFLOW_DATABASE_USER:?Set EQUIFLOW_DATABASE_USER in the Compose environment file}
  DATABASE_PASSWORD: ${EQUIFLOW_DATABASE_PASSWORD:?Set EQUIFLOW_DATABASE_PASSWORD in the Compose environment file}
  SERVICE_KEY: ${EQUIFLOW_SERVICE_KEY:?Set EQUIFLOW_SERVICE_KEY to a locally generated value of at least 32 characters}

x-business-dependencies: &business-dependencies
  registry:
    condition: service_healthy
  config:
    condition: service_healthy
  kafka:
    condition: service_healthy
  zipkin:
    condition: service_started

x-http-healthcheck: &http-healthcheck
  interval: 5s
  timeout: 5s
  start_period: 40s
  retries: 24

services:
  registry:
    <<: *app
    build:
      context: ..
      dockerfile: RunningByDocker/Dockerfile
    command: ["-jar", "/app/services/equiflow-registry-2.0.0.jar", "--eureka.server.use-read-only-response-cache=false"]
    environment: *java-environment
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:28761/actuator/health"]

  config:
    <<: *app
    command: ["-jar", "/app/services/equiflow-config-2.0.0.jar"]
    environment: *java-environment
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:28888/actuator/health"]

  identity:
    <<: *app
    command: ["-jar", "/app/services/equiflow-identity-2.0.0.jar"]
    environment:
      <<: *business-environment
      EUREKA_INSTANCE_HOSTNAME: identity
      DATABASE_URL: "jdbc:mysql://${EQUIFLOW_MYSQL_HOST:?Set EQUIFLOW_MYSQL_HOST in the Compose environment file}:${EQUIFLOW_MYSQL_PORT:-3316}/equiflow_identity?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED"
    depends_on: *business-dependencies
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8092/actuator/health && curl -fsS http://registry:28761/eureka/apps/EQUIFLOW-IDENTITY-SERVICE"]

  notification:
    <<: *app
    command: ["-jar", "/app/services/equiflow-notification-2.0.0.jar"]
    environment:
      <<: *business-environment
      EUREKA_INSTANCE_HOSTNAME: notification
      DATABASE_URL: "jdbc:mysql://${EQUIFLOW_MYSQL_HOST:?Set EQUIFLOW_MYSQL_HOST in the Compose environment file}:${EQUIFLOW_MYSQL_PORT:-3316}/equiflow_notification?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED"
    depends_on: *business-dependencies
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8093/actuator/health && curl -fsS http://registry:28761/eureka/apps/EQUIFLOW-NOTIFICATION-SERVICE"]

  maintenance:
    <<: *app
    command: ["-jar", "/app/services/equiflow-maintenance-2.0.0.jar"]
    environment:
      <<: *business-environment
      EUREKA_INSTANCE_HOSTNAME: maintenance
      DATABASE_URL: "jdbc:mysql://${EQUIFLOW_MYSQL_HOST:?Set EQUIFLOW_MYSQL_HOST in the Compose environment file}:${EQUIFLOW_MYSQL_PORT:-3316}/equiflow_maintenance?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED"
    depends_on: *business-dependencies
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8094/actuator/health && curl -fsS http://registry:28761/eureka/apps/EQUIFLOW-MAINTENANCE-SERVICE"]

  lending:
    <<: *app
    command: ["-jar", "/app/services/equiflow-lending-2.0.0.jar"]
    environment:
      <<: *business-environment
      EUREKA_INSTANCE_HOSTNAME: lending
      DATABASE_URL: "jdbc:mysql://${EQUIFLOW_MYSQL_HOST:?Set EQUIFLOW_MYSQL_HOST in the Compose environment file}:${EQUIFLOW_MYSQL_PORT:-3316}/equiflow_lending?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED"
      SPRING_PROFILES_ACTIVE: mysql
    depends_on:
      <<: *business-dependencies
      identity:
        condition: service_healthy
      notification:
        condition: service_healthy
      maintenance:
        condition: service_healthy
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/actuator/health && curl -fsS http://registry:28761/eureka/apps/EQUIFLOW-LENDING-SERVICE"]

  gateway:
    <<: *app
    command: ["-jar", "/app/services/equiflow-gateway-2.0.0.jar"]
    environment:
      <<: *discovery-environment
      EUREKA_INSTANCE_HOSTNAME: gateway
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      lending:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EQUIFLOW_HTTP_PORT:-8087}:8086"
    healthcheck:
      <<: *http-healthcheck
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8086/api/config"]

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 12

  zipkin:
    image: openzipkin/zipkin:3.5.1

volumes:
  kafka-data:
