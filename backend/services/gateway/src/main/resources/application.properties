spring.application.name=gateway
server.port=8086
server.address=127.0.0.1
spring.cloud.gateway.server.webmvc.routes[0].id=equipment-desk
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://EquiFlow-lending-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/**
eureka.client.service-url.defaultZone=http://127.0.0.1:28761/eureka/
eureka.instance.hostname=localhost
eureka.client.registry-fetch-interval-seconds=5
logging.level.com.netflix.discovery=WARN

management.tracing.sampling.probability=1
management.tracing.export.zipkin.endpoint=http://127.0.0.1:19411/api/v2/spans
