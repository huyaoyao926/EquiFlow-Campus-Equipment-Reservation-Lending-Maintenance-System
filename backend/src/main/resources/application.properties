spring.application.name=EquiFlow-lending-service
server.port=${PORT:8091}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./.local/services/lending;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
server.error.include-message=never
desk.timezone=Asia/Singapore
desk.seed-demo=${SEED_DEMO:true}
desk.booking.max-days=7
desk.booking.advance-days=60
desk.jobs.cron=0 */15 * * * *
logging.level.org.hibernate.orm.deprecation=ERROR

server.address=127.0.0.1
cluster.enabled=true
cluster.service-key=${SERVICE_KEY}
spring.config.import=optional:configserver:http://127.0.0.1:28888
eureka.client.service-url.defaultZone=http://127.0.0.1:28761/eureka/
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=6000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.listener.ack-mode=record
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.tracing.sampling.probability=1
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://127.0.0.1:19411/api/v2/spans}
logging.level.com.netflix.discovery=WARN
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.cloud.config.client=WARN
logging.level.org.hibernate.orm.deprecation=ERROR

resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=4
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s

spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
